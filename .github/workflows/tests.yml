name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests
        run: python -m unittest discover tests
      - name: Piped input
        if: runner.os != 'Windows'
        run: python -c "import sys, tempfile; sys.path.insert(0, 'scripts'); import citecheck as cc; bibs, _ = cc.collect_inputs(['/dev/stdin'], tempfile.mkdtemp()); n = len(cc.load_entries(bibs[0])[0]); print(n, 'entries from /dev/stdin'); sys.exit(n != 5)" < examples/refs.bib
      - name: Install and run the command
        run: |
          python -m pip install .
          citecheck --version
          citecheck --help
